# Broker simulation (virtual sellers listed in the normal Broker, reachable only through broker NPCs)
# Copy to <GameServer>/config/broker-simulation/

enabled = true

# ---- population -------------------------------------------------------------
# Virtual sellers PER RACE (max 100). 40 -> 80 "players" in total.
tradersPerRace = 40
# Listings each trader tries to keep up (broker limit is 15 per seller)
minListingsPerTrader = 3
maxListingsPerTrader = 6

# ---- activity ---------------------------------------------------------------
# Every tickSeconds, tradersServicedPerTick random traders restock / relist / reprice.
# Cost per tick is tiny (a few Item objects); this is the whole "load" of the system.
tickSeconds = 120
tradersServicedPerTick = 4
# How long a virtual listing stays before it is relisted at a new price (randomised 50%-150%)
listingLifetimeMinutes = 360
# Random +/- noise around price * traderFactor (each trader is 0.80x - 1.25x)
priceSpreadPercent = 10

# ---- catalog (what they sell) -----------------------------------------------
# auto = built from the server's item templates, file = broker-simulation-items.tsv, both = union
catalogSource = auto
# Number of different items in the catalog (same set after every restart for the same seed)
catalogSize = 300
catalogSeed = 48
# Template filters: tradeable, not soulbound, not timed, normal item type, name not starting with '['
minItemLevel = 0
maxItemLevel = 65
# Filter on the template (vendor) price
minItemPrice = 1
maxItemPrice = 5000000
# Share of the catalog that is plain weapons/armor (rest: materials, consumables, stones, ...)
equipmentPercent = 25
# Broker price = template price * priceMultiplier * trader factor. TUNE THIS to your server's economy.
priceMultiplier = 4.0
# Largest stack a trader will list
maxStackListed = 200

# ---- never sell these ---------------------------------------------------------
# Built in and always active: whole words npc, test, debug, dummy, gm, admin, dev, developer, placeholder, unused, sample, cheat, cbt,
# tbd, "do not use", "login stage" (case-insensitive). Catches e.g. "NPC Asmodian Abyss Polearm 02", "Draconute Sword 03 (NPC)",
# "Delay Test Design 01", "Asmodian Login Stage Cloth Male Pauldrons 01".
# Names containing '_' are internal identifiers ("Nohohon_05_A") and are blocked too:
blockUnderscoreNames = true
# Your own additions (comma separated whole words / phrases) and individual item ids:
extraBlockedWords =
blockedItemIds =
# After the first start look at broker-simulation-blocked.txt (what was removed) and broker-simulation-catalog.txt (what is sold).
dumpCatalog = true

# ---- virtual buyers (buy REAL players' broker listings) -------------------------
buyersEnabled = true
# A listing is only bought if its price per piece <= vendorPrice * priceMultiplier * (1 + tolerance)
buyerTolerancePercent = 20
# Hard cap: at most this many purchases in any window (one purchase = one buyer taking some pieces of one listing)
buyerMaxPurchases = 10
buyerWindowMinutes = 30
buyerCheckSeconds = 60
# After a listing appears (and after each purchase from it) buyers wait a random time in this range
buyerMinDelayMinutes = 5
buyerMaxDelayMinutes = 90
# One purchase takes a random 1..N % of a stack the seller allowed to split (single items / no-split listings are bought whole)
buyerMaxStackPercent = 50

# ---- buy orders (virtual buyers with specific wishes) ---------------------------
# Orders are "I buy item X, up to N pieces, at most this price per piece". When you list a matching item at or below the order price,
# it is sold to that order within a few seconds (while the purchase cap above allows it).
ordersEnabled = true
maxOrders = 120
ordersPerTick = 3
orderMinHours = 2
orderMaxHours = 12

# ---- the moving market ----------------------------------------------------------
# Every item has a market price that wanders inside [floor, ceiling] % of its reference price (vendor price x priceMultiplier).
# Example: reference 10-20 kinah -> never below 20 % (2-4) and never above 250 % (25-50).
# Trader prices and buy orders follow the market price, "current low" moves with it.
marketFloorPercent = 20
marketCeilingPercent = 250
# random move per minute, pull back towards the reference per minute
marketVolatilityPercent = 1.5
marketReversionPercent = 1.0
# +x % after every sale of that item, -x % when a trader's listing for it expires unsold
buyBumpPercent = 2.0
unsoldDropPercent = 1.0

# ---- armor, weapons, accessories, housing: only expensive items ------------------
# The virtual traders only list items of these four categories whose reference price (vendor price x priceMultiplier) is at least this many
# kinah, and their market price never drops below it. All other categories are unchanged. Your own listings are never restricted;
# virtual buyers simply ignore cheaper armor / weapons / accessories / housing.
highValueMinPrice = 100000
# Housing items are recognised by the NAME of their item group (see broker-simulation-groups.txt after the first start).
# Weapons, armor and accessories are recognised directly. Adjust this pattern if a housing group is missing or something else is caught.
highValueGroupPattern = (?i)HOUS|DECO|FURNIT
