# Beyond Aion Broker Sim: virtual traders, buyers and a moving market inside the stock Broker
# Lives in <GameServer>/config/broker-simulation/  (NEVER in config/main). Read at server start; every key has a built-in default.

enabled = true

# ---- the traders ---------------------------------------------------------------
# Traders PER FACTION (max 250). 100 -> 200 in total. Each one specialises in one kind of item (a "role") and acts on its OWN random timer,
# so changes in the broker are spread over time instead of happening all at once.
tradersPerRace = 100
# The same item is never listed more often than this by virtual traders (per faction). Raises variety.
maxListingsPerItem = 2
# The scheduler looks every tickSeconds for traders whose own timer ran out; at most maxTradersPerTick of them act per look (load cap).
tickSeconds = 20
maxTradersPerTick = 8
# Each trader has a personality: its prices are this factor times the market price (so the SAME item costs different amounts at different sellers).
# Narrow the range for a tighter market, e.g. 0.95 and 1.05.
traderPriceMinFactor = 0.85
traderPriceMaxFactor = 1.20
# Random +/- noise on every single listing, on top of the personality
priceSpreadPercent = 10

# ---- roles: percent = share of the traders, listings = how many each keeps (broker limit is 15),
#      interval = random time between two actions of one trader, lifetime = how long one of its listings stays ----------
# GENERAL   consumables, materials, stones, ... (everything that is not below)
# FURNITURE housing items
# ARMOR     armor and accessories with real stats
# WEAPON    weapons
# COSMETIC  armor / accessories / weapons of level <= cosmeticMaxLevel (costumes, skins). OFF by default (percent 0): equipmentMinLevel below removes them.
role.general.percent = 40
role.general.minListings = 3
role.general.maxListings = 6
role.general.intervalMinMinutes = 5
role.general.intervalMaxMinutes = 180
role.general.lifetimeMinutes = 360

role.furniture.percent = 10
role.furniture.minListings = 2
role.furniture.maxListings = 4
role.furniture.intervalMinMinutes = 15
role.furniture.intervalMaxMinutes = 240
role.furniture.lifetimeMinutes = 720

role.armor.percent = 25
role.armor.minListings = 3
role.armor.maxListings = 5
role.armor.intervalMinMinutes = 10
role.armor.intervalMaxMinutes = 180
role.armor.lifetimeMinutes = 480

role.weapon.percent = 25
role.weapon.minListings = 3
role.weapon.maxListings = 5
role.weapon.intervalMinMinutes = 10
role.weapon.intervalMaxMinutes = 180
role.weapon.lifetimeMinutes = 480

role.cosmetic.percent = 0
role.cosmetic.minListings = 2
role.cosmetic.maxListings = 4
role.cosmetic.intervalMinMinutes = 180
role.cosmetic.intervalMaxMinutes = 720
role.cosmetic.lifetimeMinutes = 1440

# Optional per role: role.<name>.maxListingsPerItem = 1  (0 or missing = use maxListingsPerItem above). 1 means no visible duplicates at all in that role.

# Every broker category (a sub tab of the broker window, for example "Plate gloves" or "Indoor decor") keeps at least this many items: if fewer items reach the
# role's minimum price, the minimum is lowered for that category only, to the price of its Nth most expensive item (and logged).
# This keeps categories such as Home Decor from being empty while the rest of the role keeps its minimum.
minItemsPerCategory = 8
# Stigma stones belong to the "Skill related" category. false = do not sell them.
listStigmas = true

# Items of level <= this are cosmetics. cosmeticMinPrice = cheapest reference price a cosmetic may have (0 = no minimum).
# Weapons, armor and accessories BELOW this level are never sold: 2 = no level 1 items (skins, costumes, hats) in the Weapon, Armor and Accessory tabs.
# All other tabs are not affected. 0 = sell them again (then give role.cosmetic.percent a value such as 20 so slow cosmetic traders sell them).
equipmentMinLevel = 2
cosmeticMaxLevel = 1
cosmeticMinPrice = 0

# ---- catalog (what they sell) -----------------------------------------------
# auto = built from the server's item templates, file = broker-simulation-items.tsv, both = union (file items are never rotated out)
catalogSource = auto
# Number of different items in the active catalog (split over the roles by their percent). More = more variety.
catalogSize = 1500
# 0 = a different random catalog at every start, any other number = the same catalog every time
catalogSeed = 0
# Every catalogRotateHours hours, catalogRotatePercent % of each role's items are swapped for others (0 hours = never rotate)
catalogRotateHours = 6
catalogRotatePercent = 15
# Template filters: tradeable, not soulbound, not timed, normal item type, name not starting with '['
minItemLevel = 0
maxItemLevel = 65
# Filter on the template (vendor) price
minItemPrice = 1
maxItemPrice = 5000000
# Some items drop "unidentified" (question mark icon in the broker list) because their stats are random. true = list them like the real game does,
# false = leave out every item that can have random stats.
listRandomStatItems = true
# Broker price = template price * priceMultiplier * trader factor. TUNE THIS to your server's economy.
priceMultiplier = 4.0
# Largest stack a trader will list
maxStackListed = 200

# ---- never sell these ---------------------------------------------------------
# Built in and always active: whole words npc, test, debug, dummy, gm, admin, dev, developer, placeholder, unused, sample, cheat, cbt,
# tbd, "do not use", "login stage" (case-insensitive). Catches e.g. "NPC Asmodian Abyss Polearm 02", "Draconute Sword 03 (NPC)",
# "Delay Test Design 01", "Asmodian Login Stage Cloth Male Pauldrons 01".
# Names containing '_' are internal identifiers ("Nohohon_05_A") and are blocked too:
blockUnderscoreNames = true
# Your own additions (comma separated whole words / phrases) and individual item ids:
extraBlockedWords =
blockedItemIds =
# After the first start look at broker-simulation-blocked.txt (what was removed) and broker-simulation-catalog.txt (what is sold).
dumpCatalog = true

# ---- virtual buyers (buy REAL players' broker listings) -------------------------
buyersEnabled = true
# A listing is only bought if its price per piece <= vendorPrice * priceMultiplier * (1 + tolerance)
buyerTolerancePercent = 20
# Hard cap: at most this many purchases in any window (one purchase = one buyer taking some pieces of one listing)
buyerMaxPurchases = 10
buyerWindowMinutes = 30
buyerCheckSeconds = 60
# After a listing appears (and after each purchase from it) buyers wait a random time in this range
buyerMinDelayMinutes = 5
buyerMaxDelayMinutes = 90
# One purchase takes a random 1..N % of a stack the seller allowed to split (single items / no-split listings are bought whole)
buyerMaxStackPercent = 50

# ---- buy orders (virtual buyers with specific wishes) ---------------------------
# Orders are "I buy item X, up to N pieces, at most this price per piece". When you list a matching item at or below the order price,
# it is sold to that order within a few seconds (while the purchase cap above allows it).
ordersEnabled = true
maxOrders = 120
ordersPerTick = 3
orderMinHours = 2
orderMaxHours = 12

# ---- the moving market ----------------------------------------------------------
# Every item has a market price that wanders inside [floor, ceiling] % of its reference price (vendor price x priceMultiplier).
# Example: reference 10-20 kinah -> never below 20 % (2-4) and never above 250 % (25-50).
# Trader prices and buy orders follow the market price, "current low" moves with it.
marketFloorPercent = 20
marketCeilingPercent = 250
# random move per minute, pull back towards the reference per minute
marketVolatilityPercent = 1.5
marketReversionPercent = 1.0
# +x % after every sale of that item, -x % when a trader's listing for it expires unsold
buyBumpPercent = 2.0
unsoldDropPercent = 1.0

# ---- armor, weapons, accessories, housing: only expensive items ------------------
# The virtual traders only list items of these four categories whose reference price (vendor price x priceMultiplier) is at least this many
# kinah, and their market price never drops below it. All other categories are unchanged. Your own listings are never restricted;
# virtual buyers simply ignore cheaper armor / weapons / accessories / housing.
highValueMinPrice = 100000
# Categories now come from the broker's own rules (BrokerItemMask), exactly the tabs of the broker window. This pattern on item group names is only a
# FALLBACK that is used when those rules cannot be read (the startup log then says so).
highValueGroupPattern = (?i)HOUS|DECO|FURNIT
